name: Published Heesch census data
on:
  push:
    branches: [research/heesch-baseline-20260906]
permissions:
  contents: read
jobs:
  public-data:
    if: github.repository_owner == 'dicnunz' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Retrieve author-published data without running any search
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/hex
          curl --fail --location --retry 3 https://cs.uwaterloo.ca/~csk/heesch/ -o data/index.html
          for n in 11 12 13 14 15 16 17; do
            curl --fail --location --retry 3 "https://cs.uwaterloo.ca/~csk/heesch/hex/${n}hex_3up.txt" -o "data/hex/${n}hex_3up.txt"
          done
          printf '%s\n' 'Author source: https://cs.uwaterloo.ca/~csk/heesch/' > data/SOURCE.txt
          find data -type f -exec sha256sum {} \; > data/MANIFEST.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: published-heesch-census
          path: data/
          retention-days: 1
          compression-level: 0
