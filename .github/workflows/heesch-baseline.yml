name: Public high-Heesch text dataset recovery
on:
  push:
    branches: [research/heesch-baseline-20260906]
permissions:
  contents: read
jobs:
  published-data:
    if: github.repository_owner == 'dicnunz' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Retrieve public author archive and preserve only text metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/text
          curl --fail --location --max-time 300 --retry 2 https://cs.uwaterloo.ca/~csk/heesch/heesch_dataset.tar.gz -o dataset.tar.gz
          sha256sum dataset.tar.gz > evidence/archive.sha256
          tar -tzf dataset.tar.gz > evidence/archive-members.txt
          tar -xzf dataset.tar.gz -C evidence/text --wildcards --no-anchored '*hex_3up.txt'
          find evidence/text -type f -exec sha256sum {} \; > evidence/text.sha256
          printf '%s\n' 'Author: Craig S. Kaplan' 'Source: https://cs.uwaterloo.ca/~csk/heesch/heesch_dataset.tar.gz' > evidence/SOURCE.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-high-heesch-texts
          path: evidence/
          retention-days: 1
          if-no-files-found: error
