name: Unchanged Heesch baseline with documented heap configuration
on:
  push:
    branches: [research/heesch-baseline-20260906]
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository_owner == 'dicnunz' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Prepare free runner and pinned unmodified public baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git clone https://github.com/Layr-Labs/heesch.git official
          cd official
          git checkout --detach ce3b8d6974d3f318c3c6081b421ed51c7d041d6e
          git rev-parse HEAD > ../evidence/official-commit.txt
          printf '%s\n' '87d35cd173835f0f775cc632921423f6d511dea88352eca30124010cb02b3572  submission/best.heesch' '1cefa72c2147ab6e1aa9b02c9f4715f07c82a6fb9aa5175097cddf632102b10e  submission/proof.drat.xz' | sha256sum -c - > ../evidence/original-hashes.txt
          sudo fallocate -l 24G /mnt/heesch-verification.swap
          sudo chmod 600 /mnt/heesch-verification.swap
          sudo mkswap /mnt/heesch-verification.swap
          sudo swapon /mnt/heesch-verification.swap
          bash setup.sh 2>&1 | tee ../evidence/setup.log
          { uname -a; nproc; free -m; swapon --show; df -h .; printf '%s\n' 'HEESCH_CAKE_HEAP_MB=24576 (documented official checker option; no profile override)'; } > ../evidence/environment.txt
          git diff --exit-code
      - name: Run unchanged original benchmark
        shell: bash
        run: |
          set -o pipefail
          cd official
          export HEESCH_CAKE_HEAP_MB=24576
          /usr/bin/time -v bash benchmark.sh 2>&1 | tee ../evidence/benchmark.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../evidence/benchmark.exit
          test ! -f score.json || cp score.json ../evidence/score.json
          git diff --exit-code > ../evidence/source-diff.txt
          exit "$status"
      - name: Preserve exact output even on resource failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-documented-heap-evidence
          path: evidence/
          retention-days: 1
          if-no-files-found: error
  published-shape-data:
    if: github.repository_owner == 'dicnunz' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Retrieve public text data where the author server permits access
        shell: bash
        run: |
          mkdir -p data
          for n in 11 13 15 16 17; do
            url="https://cs.uwaterloo.ca/~csk/heesch/hex/${n}hex_3up.txt"
            curl -A 'Mozilla/5.0' --fail --location --max-time 30 "$url" -o "data/${n}hex_3up.txt" 2>>data/retrieval.log || true
          done
          find data -type f -exec sha256sum {} \; > data/MANIFEST.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: published-shape-data
          path: data/
          retention-days: 1
