name: Public Heesch tools for local offline research
on:
  push:
    branches: [research/heesch-baseline-20260906]
permissions:
  contents: read
jobs:
  public-tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Retrieve public sources and compile Linux executables
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y libcryptominisat5-dev cryptominisat libboost-dev
          git clone --depth 1 https://github.com/isohedral/heesch-sat.git kaplan
          git clone https://github.com/Layr-Labs/heesch.git official
          git -C official checkout --detach ce3b8d6974d3f318c3c6081b421ed51c7d041d6e
          mkdir -p public-tools/bin public-tools/lib public-tools/wheels public-tools/include
          git -C kaplan rev-parse HEAD > public-tools/kaplan-commit.txt
          git -C official archive HEAD | gzip -1 > public-tools/official-pinned.tar.gz
          git -C kaplan archive HEAD | gzip -1 > public-tools/kaplan-source.tar.gz
          cp -R /usr/include/cryptominisat5 public-tools/include/
          g++ -std=c++17 -O3 -DNDEBUG -I/usr/include/cryptominisat5 kaplan/src/sat.cpp -o public-tools/bin/heesch-sat -lcryptominisat5 > public-tools/build.log 2>&1 || cat public-tools/build.log
          cp /usr/lib/x86_64-linux-gnu/libcryptominisat5.so* public-tools/lib/
          cp /usr/lib/x86_64-linux-gnu/libm4ri*.so* public-tools/lib/
          cp /usr/lib/x86_64-linux-gnu/libboost_program_options*.so* public-tools/lib/
          cp /usr/bin/cryptominisat5 public-tools/bin/ || cp /usr/bin/cryptominisat public-tools/bin/
          test ! -f public-tools/bin/heesch-sat || ldd public-tools/bin/heesch-sat > public-tools/ldd.txt
          python3 -m pip download --only-binary=:all: --python-version 313 --implementation cp --abi cp313 --platform manylinux_2_17_x86_64 -d public-tools/wheels python-sat || true
          find public-tools -type f -exec sha256sum {} \; > public-tools.sha256
          tar -czf public-tools.tar.gz public-tools public-tools.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: public-tools
          path: public-tools.tar.gz
          retention-days: 1
          compression-level: 0
