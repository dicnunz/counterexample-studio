name: Public polyiamond data for local Heesch research
on:
  push:
    branches: [research/heesch-baseline-20260906]
permissions:
  contents: read
jobs:
  public-data:
    if: github.repository_owner == 'dicnunz' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download original author archive and extract text datasets
        run: |
          set -euo pipefail
          mkdir -p public-data
          curl --fail --location --max-time 120 https://cs.uwaterloo.ca/~csk/heesch/heesch_dataset.tar.gz -o author.tar.gz
          sha256sum author.tar.gz > public-data/archive.sha256
          python3 - <<'PY'
          import pathlib,tarfile,hashlib
          out=pathlib.Path('public-data')
          with tarfile.open('author.tar.gz') as archive:
              for entry in archive:
                  if entry.isfile() and entry.name.startswith('dataset/iamond/') and entry.name.endswith('.txt'):
                      content=archive.extractfile(entry).read()
                      name=pathlib.Path(entry.name).name
                      (out/name).write_bytes(content)
          (out/'SOURCE.txt').write_text('Author: Craig S. Kaplan\nSource: https://cs.uwaterloo.ca/~csk/heesch/heesch_dataset.tar.gz\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: public-iamond-texts
          path: public-data/
          retention-days: 1
          if-no-files-found: error
